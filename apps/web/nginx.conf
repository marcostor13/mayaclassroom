# `Connection: upgrade` solo cuando el cliente lo pide; en cualquier otro caso
# debe llegar vacío o nginx rompe las peticiones normales al reutilizar la
# conexión.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cabeceras de seguridad
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Los recursos con hash pueden cachearse indefinidamente.
  location ~* \.(js|css|woff2?|svg|png|jpg|webp|avif)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Reenvío al backend para el despliegue con docker-compose, donde ambos
  # servicios comparten red y el cliente usa la ruta relativa `/api/v1`.
  #
  # En Coolify cada aplicación es independiente y el navegador llama directo al
  # dominio de la API (ARG API_URL), así que este bloque no recibe tráfico. Aun
  # así el destino se declara en una variable a propósito: con un nombre de
  # host literal, nginx resuelve al arrancar y el contenedor no llegaría a
  # levantar cuando `api` no existe.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "http://api:3000";
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Ascenso a WebSocket para la señalización de las aulas en vivo
    # (`/api/live-socket`). Sin estas cabeceras el socket cae a sondeo largo o
    # no conecta, según el navegador.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  # Enrutado del lado del cliente.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
