server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cabeceras de seguridad
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Los recursos con hash pueden cachearse indefinidamente.
  location ~* \.(js|css|woff2?|svg|png|jpg|webp|avif)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Reenvío al backend para el despliegue con docker-compose, donde ambos
  # servicios comparten red y el cliente usa la ruta relativa `/api/v1`.
  #
  # En Coolify cada aplicación es independiente y el navegador llama directo al
  # dominio de la API (ARG API_URL), así que este bloque no recibe tráfico. Aun
  # así el destino se declara en una variable a propósito: con un nombre de
  # host literal, nginx resuelve al arrancar y el contenedor no llegaría a
  # levantar cuando `api` no existe.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "http://api:3000";
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Enrutado del lado del cliente.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
