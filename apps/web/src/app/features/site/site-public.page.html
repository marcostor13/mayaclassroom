@if (loading()) {
  <div class="cargando">
    <div class="maya-skeleton" style="height: 56px"></div>
    <div class="maya-skeleton" style="height: 40vh"></div>
    <div class="maya-skeleton" style="height: 22vh"></div>
  </div>
} @else if (notFound()) {
  <div class="no-disponible">
    <maya-icon name="globe" [size]="40" />
    <h1>Página no disponible</h1>
    <p class="maya-muted">
      Puede que la dirección no sea correcta o que esta empresa todavía no haya publicado su
      página.
    </p>
    <a class="maya-btn maya-btn--primary" href="/auth/login">Ir a Maya Classroom</a>
  </div>
} @else if (render(); as datos) {
  <maya-site-render
    [data]="datos"
    [sections]="data()!.site.sections"
    [activeCategory]="categoryFilter()"
    (categoryFilter)="categoryFilter.set($event)"
    (courseOpen)="abrirCurso($event)"
  />

  <!-- Recorrido guiado de la demostración. Flota sobre la página porque su
       público es quien está mirando la página, no quien la administra. -->
  <button type="button" class="tour-boton" (click)="abrirTour()">
    <maya-icon name="help-circle" [size]="18" />
    <span>Cómo funciona</span>
  </button>

  @if (tourAbierto()) {
    <maya-guide-tour
      title="Cómo funciona"
      [steps]="tour"
      [index]="tourPaso()"
      (next)="siguientePaso()"
      (prev)="pasoAnterior()"
      (close)="cerrarTour()"
    />
  }
}
