name: Desplegar

# Entrega continua: cada push a `main` compila, prueba y, solo si todo pasa,
# dispara el despliegue de las dos aplicaciones en Coolify.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      objetivo:
        description: 'Qué desplegar'
        required: true
        default: 'ambos'
        type: choice
        options: [ambos, api, web]

# Un despliegue a la vez: si llegan dos push seguidos, el segundo espera en vez
# de competir por el mismo contenedor.
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  verificar:
    name: Compilar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Preparar Node
        # Bun gestiona dependencias y guiones, pero los CLI de Nest y Angular se
        # invocan con shebang `node`. Angular 22 exige Node >= 22.22.3.
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Compilar los contratos compartidos
        run: bun run build:shared

      - name: Verificar tipos de la API
        run: bunx tsc -p apps/api/tsconfig.json --noEmit

      - name: Análisis estático de la API
        run: bun run lint

      - name: Pruebas de la API
        run: bun run test

      - name: Compilar la API
        run: bun run build:api

      - name: Compilar el cliente
        run: bun run build:web

  desplegar:
    name: Desplegar en Coolify
    needs: verificar
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Sincronizar DNS en Cloudflare
        # Idempotente: crea los CNAME al túnel la primera vez y no toca nada
        # después. Se ejecuta antes del despliegue para que el dominio ya
        # resuelva cuando el contenedor quede sano.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_NAME: ${{ vars.CLOUDFLARE_ZONE_NAME }}
          CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
          FRONTEND_DOMAIN: ${{ vars.FRONTEND_DOMAIN }}
          BACKEND_DOMAIN: ${{ vars.BACKEND_DOMAIN }}
        run: bun run deploy --dns

      - name: Sincronizar dominios en Coolify
        # Idempotente, como el paso anterior. Deja el FQDN de cada aplicación y
        # las variables que dependen del dominio (API_URL, WEB_URL,
        # CORS_ORIGINS) alineadas con la configuración antes de reconstruir:
        # API_URL se incrusta en el paquete del cliente al compilar, así que
        # ponerla después del despliegue no tendría efecto hasta el siguiente.
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
          COOLIFY_WEB_UUID: ${{ secrets.COOLIFY_WEB_UUID }}
          CLOUDFLARE_ZONE_NAME: ${{ vars.CLOUDFLARE_ZONE_NAME }}
          FRONTEND_DOMAIN: ${{ vars.FRONTEND_DOMAIN }}
          BACKEND_DOMAIN: ${{ vars.BACKEND_DOMAIN }}
          WEB_URL: ${{ vars.WEB_URL }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          API_URL: ${{ vars.API_URL }}
        run: bun run deploy --coolify

      - name: Desplegar
        # El guion valida antes que cada UUID pertenece a este repositorio; si
        # no, aborta sin disparar nada. Es la protección contra un UUID heredado
        # de otro proyecto, que desplegaría este código sobre una app ajena.
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
          COOLIFY_WEB_UUID: ${{ secrets.COOLIFY_WEB_UUID }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          FRONTEND_DOMAIN: ${{ vars.FRONTEND_DOMAIN }}
          BACKEND_DOMAIN: ${{ vars.BACKEND_DOMAIN }}
        run: |
          case "${{ inputs.objetivo || 'ambos' }}" in
            api) bun run deploy --api ;;
            web) bun run deploy --web ;;
            *)   bun run deploy ;;
          esac

  comprobar:
    name: Comprobar en producción
    needs: desplegar
    runs-on: ubuntu-latest
    # El MISMO entorno que `desplegar`. Sin esta línea el job solo ve las
    # variables de nivel repositorio: las definidas en el entorno `production`
    # llegan vacías, la comprobación pide «https:///» y falla los cuarenta
    # reintentos seguidos aunque producción esté sana. Ese era el fallo.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Esperar a que las aplicaciones respondan
        # Coolify construye las imágenes de forma asíncrona, así que el paso
        # anterior solo encola. Aquí se espera primero a que la construcción
        # termine y después a que el dominio público responda: comprobar solo
        # la URL da un 200 engañoso servido por la versión anterior.
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
          COOLIFY_WEB_UUID: ${{ secrets.COOLIFY_WEB_UUID }}
          FRONTEND_DOMAIN: ${{ vars.FRONTEND_DOMAIN }}
          BACKEND_DOMAIN: ${{ vars.BACKEND_DOMAIN }}
        run: bun run deploy --esperar
