name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          # El CLI de Angular 22 exige Node ≥ 22.22.3.
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar los contratos compartidos
        run: npm run build:shared

      - name: Verificar tipos de la API
        run: npx tsc -p apps/api/tsconfig.json --noEmit

      - name: Pruebas de la API
        run: npm run test --workspace @maya/api

      - name: Compilar la API
        run: npm run build:api

      - name: Compilar el cliente
        run: npm run build:web
