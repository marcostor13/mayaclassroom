name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Preparar Node
        # Bun gestiona dependencias y guiones, pero los CLI de Nest y Angular se
        # invocan con shebang `node`. Angular 22 exige Node ≥ 22.22.3.
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Compilar los contratos compartidos
        run: bun run build:shared

      - name: Verificar tipos de la API
        run: bunx tsc -p apps/api/tsconfig.json --noEmit

      - name: Análisis estático de la API
        run: bun run lint

      - name: Pruebas de la API
        run: bun run test

      - name: Compilar la API
        run: bun run build:api

      - name: Compilar el cliente
        run: bun run build:web
